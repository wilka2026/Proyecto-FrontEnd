<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalFit - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body class="netflix-bg">

  <!-- Navbar sencilla tipo Netflix -->
  <header class="navbar-netflix">
    <div class="logo">⚡ VITAL<span>FIT</span></div>
  </header>

  <main class="auth-container">

    <!-- TARJETA UNIFICADA (Estilo Netflix) -->
    <div class="netflix-card">
      
      <!-- CONTENEDOR 1: INICIO DE SESIÓN -->
      <div id="login-container" class="auth-box">
        <h2>Inicia Sesión</h2>
        
        <form id="loginForm" action="ejecicio.html" method="GET" class="form-vertical">
          <div class="form-group">
            <input type="email" name="email" id="login_email" placeholder="Correo electrónico" required>
          </div>

          <div class="form-group">
            <input type="password" name="password" id="login_password" placeholder="Contraseña" required>
          </div>

          <button type="submit" class="btn btn-primary btn-full" >Iniciar Sesión</button>

          <div class="form-actions-netflix">
            <label class="switch-label">
              <input type="checkbox" id="remember_me">
              <span>Recuérdame</span>
            </label>
            <a href="#" class="help-link">¿Necesitas ayuda?</a>
          </div>
        </form>

        <!-- Botón/Enlace alternador hacia Registro -->
        <div class="switch-auth-mode">
          <p>¿Primera vez en VitalFit? <button type="button" id="btn-show-register" class="btn-text-action">Suscríbete ahora.</button></p>
        </div>
      </div>

      <!-- CONTENEDOR 2: REGISTRO (Oculto inicialmente, activo con la clase 'active') -->
      <div id="register-container" class="auth-box hidden">
        <h2>Únete a VitalFit</h2>
        <p class="subtitle">Paso 1: Crea tu perfil biométrico (Sprint 1)</p>
        
        <form id="registerForm" action="ejercicio.html" method="GET" class="form-grid">
          <!-- email -->
          <div class="form-group full-width">
            <label for="email">Correo Electrónico *</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
          </div>

          <!-- password -->
          <div class="form-group full-width">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
          </div>

          <!-- age -->
          <div class="form-group">
            <label for="age">Edad *</label>
            <input type="number" id="age" name="age" placeholder="25" min="14" max="100" required>
          </div>

          <!-- weight -->
          <div class="form-group">
            <label for="weight">Peso (kg) *</label>
            <input type="number" step="0.1" id="weight" name="weight" placeholder="65.5" min="20" max="300" required>
          </div>

          <!-- height -->
          <div class="form-group">
            <label for="height">Estatura (cm) *</label>
            <input type="number" id="height" name="height" placeholder="170" min="100" max="250" required>
          </div>

          <!-- goal -->
          <div class="form-group">
            <label for="goal">Objetivo *</label>
            <select id="goal" name="goal" required>
              <option value="" disabled selected>Selecciona...</option>
              <option value="MUSCLE_GAIN">Ganancia Muscular</option>
              <option value="FAT_LOSS">Pérdida de Grasa</option>
              <option value="MAINTENANCE">Mantenimiento</option>
            </select>
          </div>

          <div class="form-group full-width">
            <button type="submit" class="btn btn-primary btn-full">Registrarme e Iniciar Onboarding</button>
          </div>
        </form>

        <!-- Botón/Enlace alternador hacia Login -->
        <div class="switch-auth-mode">
          <p>¿Ya tienes cuenta? <button type="button" id="btn-show-login" class="btn-text-action">Inicia sesión aquí.</button></p>
        </div>
      </div>

    </div>

  </main>

  <!-- Script para alternar entre Login y Registro -->
  <script>
    const loginBox = document.getElementById('login-container');
    const registerBox = document.getElementById('register-container');
    const btnShowRegister = document.getElementById('btn-show-register');
    const btnShowLogin = document.getElementById('btn-show-login');

    btnShowRegister.addEventListener('click', () => {
      loginBox.classList.add('hidden');
      registerBox.classList.remove('hidden');
    });

    btnShowLogin.addEventListener('click', () => {
      registerBox.classList.remove('hidden');
      loginBox.classList.remove('hidden');
    });
  </script>

</body>
</html>
